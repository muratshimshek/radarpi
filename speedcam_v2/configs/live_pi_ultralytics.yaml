app:
  name: SpeedCam V2 Live
  active_profile: SAG
  show_window: false
  draw_guides: true
  web_host: 0.0.0.0
  web_port: 5001
  log_level: INFO

camera:
  source: 0
  width: 640
  height: 360
  fps: 25
  use_picamera2: true
  replay_realtime: true
  replay_loop: false
  replay_speed_multiplier: 1.0

model:
  backend: none
  path: ""
  classes: [2]
  conf_threshold: 0.35
  nms_threshold: 0.45
  input_size: 640
  opencv_fallback_enabled: false

tracking:
  stable_hits: 5
  lost_tolerance_seconds: 0.5
  max_center_jump_px: 90
  max_lateral_jump_px: 42
  max_reverse_motion_px: 18
  max_scale_ratio: 1.8
  min_area_ratio_of_prev: 0.30
  smoothing_alpha: 0.35
  prediction_damping: 0.92

measurement:
  real_distance_meters: 10.0
  min_elapsed_seconds: 0.5
  max_elapsed_seconds: 8.0
  speed_limit_kmh: 50.0
  done_display_seconds: 3.0

homography:
  enabled: false

performance:
  queue_size: 1
  jpeg_quality: 70
